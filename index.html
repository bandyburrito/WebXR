<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Pico Scene</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script>
    // Point at a .grabbable object and hold grip OR trigger to pick it up.
    // Different Pico runtimes name the grip button "grip" or "squeeze", so listen for all of them.
    AFRAME.registerComponent('grabber', {
      init() {
        this.grabbed = null;
        const grab = () => {
          if (this.grabbed) return;
          const hit = this.el.components.raycaster.intersectedEls.find(el => el.classList.contains('grabbable'));
          if (!hit) return;
          // Stop spin/float animations so they don't fight the controller
          hit.removeAttribute('animation');
          hit.removeAttribute('animation__float');
          this.el.object3D.attach(hit.object3D);
          this.grabbed = hit;
        };
        const release = () => {
          if (!this.grabbed) return;
          this.el.sceneEl.object3D.attach(this.grabbed.object3D);
          this.grabbed = null;
        };
        ['gripdown', 'squeezedown', 'triggerdown'].forEach(e => this.el.addEventListener(e, grab));
        ['gripup', 'squeezeup', 'triggerup'].forEach(e => this.el.addEventListener(e, release));
      }
    });
  </script>
</head>
<body>
  <a-scene
    webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
    renderer="antialias: true; colorManagement: true; foveationLevel: 1"
    vr-mode-ui="enabled: true"
    fog="type: exponential; color: #000; density: 0.06">

    <!-- Night: black sky, dim bluish moonlight -->
    <a-sky color="#000000"></a-sky>
    <a-plane rotation="-90 0 0" width="40" height="40" color="#2f5a2a"></a-plane>
    <a-entity light="type: ambient; intensity: 0.25; color: #8899cc"></a-entity>
    <a-entity light="type: directional; intensity: 0.3; color: #aabbff" position="1 3 2"></a-entity>

    <!-- Torches and trees are generated by the script at the bottom -->
    <a-entity id="torches"></a-entity>
    <a-entity id="trees"></a-entity>

    <a-box class="clickable grabbable" position="-1.7 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-sphere class="clickable" position="0 1.25 -4" radius="1.25" color="#EF2D5E"></a-sphere>
    <a-cylinder class="clickable" position="1.7 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

    <!-- Two spinning squares floating in the sky in front of the player -->
    <a-box class="clickable grabbable" position="-2 5 -8" width="1.5" height="1.5" depth="1.5" color="#8A5CF6"
      animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear"
      animation__float="property: position; to: -2 5.5 -8; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"></a-box>
    <a-box class="clickable grabbable" position="2 5 -8" width="1.5" height="1.5" depth="1.5" color="#F97316"
      animation="property: rotation; to: 0 -360 360; loop: true; dur: 4000; easing: linear"
      animation__float="property: position; to: 2 4.5 -8; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"></a-box>

    <!-- Player rig: camera + Pico controllers (laser-controls auto-detects pico-controls) -->
    <a-entity id="rig">
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
      <a-entity laser-controls="hand: left" grabber raycaster="objects: .clickable; far: 20"></a-entity>
      <a-entity laser-controls="hand: right" grabber raycaster="objects: .clickable; far: 20"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Change colour of an object when you click it with the controller trigger
    // (grabbable blocks use the trigger for grabbing instead)
    document.querySelectorAll('.clickable:not(.grabbable)').forEach(el => {
      el.addEventListener('click', () => {
        el.setAttribute('color', '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
      });
    });

    // Torches: wooden stick + glowing flame + flickering point light
    const torchSpots = [[-4, -2], [4, -2], [-4, -7], [4, -7], [0, 3]];
    const torches = document.getElementById('torches');
    torchSpots.forEach(([x, z], i) => {
      const t = document.createElement('a-entity');
      t.setAttribute('position', `${x} 0 ${z}`);
      t.innerHTML = `
        <a-cylinder radius="0.05" height="1.4" position="0 0.7 0" color="#5b3a1e"></a-cylinder>
        <a-cone radius-bottom="0.12" radius-top="0" height="0.3" position="0 1.55 0"
          material="color: #ffa31a; emissive: #ff6a00; emissiveIntensity: 1"
          animation="property: scale; to: 1.15 1.3 1.15; dir: alternate; loop: true; dur: ${150 + i * 37}"></a-cone>
        <a-entity position="0 1.7 0" light="type: point; color: #ff8a2a; intensity: 3; distance: 10; decay: 1"
          animation="property: light.intensity; from: 2.4; to: 3.4; dir: alternate; loop: true; dur: ${120 + i * 53}"></a-entity>`;
      torches.appendChild(t);
    });

    // Trees: a ring of pine trees around the play area (kept clear of the centre)
    const trees = document.getElementById('trees');
    for (let i = 0; i < 40; i++) {
      const angle = (i / 40) * Math.PI * 2 + Math.random() * 0.1;
      const dist = 8 + Math.random() * 10;
      const s = 0.8 + Math.random() * 0.7;
      const tree = document.createElement('a-entity');
      tree.setAttribute('position', `${Math.cos(angle) * dist} 0 ${Math.sin(angle) * dist}`);
      tree.setAttribute('scale', `${s} ${s} ${s}`);
      tree.innerHTML = `
        <a-cylinder radius="0.2" height="1.2" position="0 0.6 0" color="#4a2f18"></a-cylinder>
        <a-cone radius-bottom="1.1" height="1.8" position="0 1.9 0" color="#1f4d25"></a-cone>
        <a-cone radius-bottom="0.8" height="1.4" position="0 2.8 0" color="#24592b"></a-cone>`;
      trees.appendChild(tree);
    }
  </script>
</body>
</html>
