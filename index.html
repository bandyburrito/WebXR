<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Pico Scene</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene
    webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
    renderer="antialias: true; colorManagement: true; foveationLevel: 1"
    vr-mode-ui="enabled: true">

    <a-sky color="#9ecbff"></a-sky>
    <a-plane rotation="-90 0 0" width="20" height="20" color="#7bc86c"></a-plane>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

    <a-box class="clickable" position="-1 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-sphere class="clickable" position="0 1.25 -4" radius="1.25" color="#EF2D5E"></a-sphere>
    <a-cylinder class="clickable" position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

    <!-- Player rig: camera + Pico controllers (laser-controls auto-detects pico-controls) -->
    <a-entity id="rig">
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Change colour of an object when you click it with the controller trigger
    document.querySelectorAll('.clickable').forEach(el => {
      el.addEventListener('click', () => {
        el.setAttribute('color', '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
      });
    });
  </script>
</body>
</html>
