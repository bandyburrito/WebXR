<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sort It Out</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <!-- Our game code. Loaded here so its components exist before the scene starts. -->
  <script src="game.js"></script>
  <style>
    body { font-family: sans-serif; }

    /* Start screen: a normal web page shown before AR starts */
    #start-screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1b3a2b; color: white; text-align: center; padding: 20px;
    }
    #start-screen h1 { font-size: 2.4em; margin: 0 0 10px; }
    #start-button {
      font-size: 1.4em; padding: 16px 40px; margin-top: 20px;
      border: none; border-radius: 30px; background: #4ade80; color: #1b3a2b; font-weight: bold;
    }
    #pc-button {
      font-size: 1.1em; padding: 12px 30px; margin-top: 12px;
      border: 2px solid #4ade80; border-radius: 30px; background: none; color: #4ade80;
    }

    /* Overlay: drawn on top of the 3D view while playing.
       Hidden until the game starts. "touch-action: none" stops the browser from
       scrolling/zooming when we swipe. */
    #overlay { display: none; position: fixed; inset: 0; z-index: 5; touch-action: none; }
    #overlay.active { display: block; }
    #message {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6); color: white; padding: 10px 18px;
      border-radius: 20px; font-size: 1.1em; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>Sort It Out ♻️</h1>
    <p>Throw the trash into the right bin!</p>
    <button id="start-button">Start AR</button>
    <p id="ar-warning"></p>
    <!-- Only shown when this device can't do AR (e.g. a PC) -->
    <button id="pc-button" hidden>Test on PC</button>
  </div>

  <!-- Overlay (HUD) on top of the camera view. "a-no-style" = we style it ourselves. -->
  <div id="overlay" class="a-no-style">
    <div id="message">Move your phone slowly to find the floor</div>
  </div>

  <!--
    webxr:      we need "hit-test" (find real surfaces) and "local-floor" (floor = height 0).
                overlayElement = the HUD above, shown on top of the camera.
    xr-mode-ui: only AR mode, and our big "Start AR" button enters it.
  -->
  <a-scene
    game
    webxr="requiredFeatures: hit-test, local-floor; overlayElement: #overlay"
    xr-mode-ui="XRMode: ar; enterARButton: #start-button"
    renderer="colorManagement: true">

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 1"></a-entity>

    <!-- White ring that sits on the floor where you point your phone -->
    <a-ring id="reticle" floor-finder radius-inner="0.08" radius-outer="0.11"
      rotation="-90 0 0" material="color: white; shader: flat"></a-ring>

    <!-- pc-controls = arrow keys + WASD, only used in PC test mode -->
    <a-entity camera pc-controls></a-entity>
  </a-scene>
</body>
</html>
